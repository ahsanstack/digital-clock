<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="clock-card">
      <div class="time-display">
        <span id="hours">00</span><span class="colon">:</span
        ><span id="minutes">00</span><span class="colon">:</span
        ><span id="seconds">00</span>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
