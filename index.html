<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow"></div>

    <main class="clock-card">
      <p class="greeting" id="greeting">Good Day</p>

      <div class="time-display">
        <span id="hours">00</span><span class="colon">:</span
        ><span id="minutes">00</span><span class="colon">:</span
        ><span id="seconds">00</span>
        <span id="ampm" class="ampm">AM</span>
      </div>
      <p class="date-display" id="date">Monday, January 1, 2026</p>
      <div class="controls">
        <button id="formatToggle" class="btn">Switch to 24-Hour</button>
        <button id="themeToggle" class="btn btn-secondary">Change Theme</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
