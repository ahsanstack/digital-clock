<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg viewBox="0 0 24 24" class="brand-icon">
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.6"
              fill="none"
            />
            <path
              d="M12 7v5l3 2"
              stroke="currentColor"
              stroke-width="1.6"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>digital</span>
        </div>

        <nav class="nav-menu">
          <button
            class="nav-item active"
            data-tab="clock-panel"
            data-title="Clock"
          >
            <svg viewBox="0 0 24 24">
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
              />
              <path
                d="M12 7v5l3 2"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Clock</span>
          </button>
          <button class="nav-item" data-tab="alarm-panel" data-title="Alarm">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 3a6 6 0 0 0-6 6v3.2c0 .5-.2 1-.5 1.4L4 16h16l-1.5-2.4c-.3-.4-.5-.9-.5-1.4V9a6 6 0 0 0-6-6Z"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
                stroke-linejoin="round"
              />
              <path
                d="M9.5 19a2.5 2.5 0 0 0 5 0"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
                stroke-linecap="round"
              />
            </svg>
            <span>Alarm</span>
          </button>
          <button
            class="nav-item"
            data-tab="stopwatch-panel"
            data-title="Stopwatch"
          >
            <svg viewBox="0 0 24 24">
              <rect
                x="9"
                y="2"
                width="6"
                height="2.4"
                rx="1"
                fill="currentColor"
              />
              <circle
                cx="12"
                cy="14"
                r="8"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
              />
              <path
                d="M12 10v4l3 2"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M18.5 6.5l1.3-1.3"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <span>Stopwatch</span>
          </button>

          <button class="nav-item" data-tab="timer-panel" data-title="Timer">
            <svg viewBox="0 0 24 24">
              <path
                d="M7 3h10M7 21h10"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
              <path
                d="M7 3c0 5 5 5 5 9s-5 4-5 9M17 3c0 5-5 5-5 9s5 4 5 9"
                stroke="currentColor"
                stroke-width="1.6"
                fill="none"
                stroke-linejoin="round"
              />
            </svg>
            <span>Timer</span>
          </button>
        </nav>
        <div class="sidebar-footer">v2.0</div>
      </aside>

      <div class="main-area">
        <header class="topbar">
          <h1 class="panel-title" id="panelTitle">Clock</h1>
        </header>

        <div class="content">
          <section id="clock-panel" class="tab-panel active">
            <div class="panel-card">
              <p class="greeting" id="greeting">Good Day</p>

              <div class="time-display">
                <span id="hours">00</span><span class="colon">:</span
                ><span id="minutes">00</span><span class="colon">:</span
                ><span id="seconds">00</span>
                <span id="ampm" class="ampm">AM</span>
              </div>
              <p class="date-display" id="date">Monday, January 1, 2026</p>
              <div class="controls">
                <button id="formatToggle" class="btn">Switch to 24-Hour</button>
              </div>
            </div>
          </section>
          <section id="alarm-panel" class="tab-panel">
            <div class="panel-card">
              <p class="panel-subtitle">Set an Alarm</p>

              <div class="row-inputs">
                <input type="time" id="alarmInput" class="input-field" />
                <button id="addAlarmBtn" class="btn">Add Alarm</button>
              </div>

              <ul id="alarmList" class="item-list"></ul>

              <div id="alarmRinging" class="ringing-banner hidden">
                ⏰ Alarm ringing!
                <button id="dismissAlarmBtn" class="btn btn-secondary">
                  Dismiss
                </button>
              </div>
            </div>
          </section>
          <section id="stopwatch-panel" class="tab-panel">
            <div class="panel-card">
              <p class="panel-subtitle">Stopwatch</p>

              <div class="mono-display" id="stopwatchDisplay">00:00:00.00</div>

              <div class="controls">
                <button id="swStartBtn" class="btn">Start</button>
                <button id="swLapBtn" class="btn btn-secondary">Lap</button>
                <button id="swResetBtn" class="btn btn-secondary">Reset</button>
              </div>

              <ul id="lapList" class="item-list"></ul>
            </div>
          </section>
          <section id="timer-panel" class="tab-panel">
            <div class="panel-card">
              <p class="panel-subtitle">Countdown Timer</p>

              <div class="row-inputs">
                <input
                  type="number"
                  id="timerMinutes"
                  class="input-field small"
                  placeholder="MM"
                  min="0"
                  max="99"
                />
                <span class="sep">:</span>
                <input
                  type="number"
                  id="timerSeconds"
                  class="input-field small"
                  placeholder="SS"
                  min="0"
                  max="59"
                />
              </div>

              <div class="mono-display" id="timerDisplay">00:00</div>

              <div class="controls">
                <button id="timerStartBtn" class="btn">Start</button>
                <button id="timerResetBtn" class="btn btn-secondary">
                  Reset
                </button>
              </div>

              <div id="timerDone" class="ringing-banner hidden">
                ⏳ Time's up!
                <button id="dismissTimerBtn" class="btn btn-secondary">
                  Dismiss
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
